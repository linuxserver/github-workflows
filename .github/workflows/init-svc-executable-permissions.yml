name: Permission check
on:
  workflow_call:

jobs:
  permission_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Permissions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TREE=$(gh api "repos/${REPO}/git/trees/${HEAD_SHA}?recursive=1")
          if [ "$(jq -r '.truncated' <<< "${TREE}")" = "true" ]; then
            echo "::error title=Tree Truncated::The tree of ${HEAD_SHA} is too large to check through the API"
            exit 1
          fi
          WRONG_PERM=$(jq -r '.tree[] | select(.mode == "100644") | .path | select(test("(^|/)(run|finish|check)$"))' <<< "${TREE}")
          if [ -n "${WRONG_PERM}" ]; then
            for i in ${WRONG_PERM}; do
              echo "::error file=${i},line=1,title=Missing Executable Bit::This file needs to be set as executable!"
            done
            exit 1
          else
            echo "**** All perms look good ****"
          fi
